name: Build Rust PC Booster Helper
on:
  push:
    branches: [main]
    paths:
      - "helper-rust/**"
      - ".github/workflows/build-rust-helper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper-rust
      - name: Build release executable
        working-directory: helper-rust
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "helper-rust/target/x86_64-pc-windows-msvc/release/pc-booster-helper.exe" "out/PC Booster Helper.exe"
          Compress-Archive -Path "out/PC Booster Helper.exe" -DestinationPath "PC-Booster-Helper-Rust-Windows-x64.zip" -Force
      - name: Publish Rust Helper 0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "helper-v0.2.0"
          gh release create $tag "out/PC Booster Helper.exe" "PC-Booster-Helper-Rust-Windows-x64.zip" --repo ${{ github.repository }} --title "PC Booster Helper 0.2.0 (Rust)" --notes "Windows 10/11 x64. Rust system engine, local-only API, authenticated pairing, PC diagnostics, allowlisted reversible user-level tweaks with rollback. No arbitrary command execution." 
