          $installerUrl = "https://github.com/relax234/PC-Booster/releases/download/desktop-v$appVersion/PC-Booster-Setup.exe"
          $manifest | Add-Member -NotePropertyName installerUrl -NotePropertyValue $installerUrl -Force
          $manifest | ConvertTo-Json -Compress | Set-Content -Path "latest.json" -Encoding utf8NoBOM
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $publishedManifest = Get-Content "latest.json" -Raw | ConvertFrom-Json
          $version = [string]$publishedManifest.version
          $tag = "desktop-v$version"
          $title = "PC Booster Desktop $version"
          $notes = @"
          PC Booster Desktop $version

          - Добавлены отдельные настройки «Вид» и «Анимации».
