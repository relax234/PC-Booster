name: Build PC Booster Desktop
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
concurrency:
  group: pc-booster-desktop-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish fully self-contained single-file EXE
        shell: pwsh
        run: |
          dotnet publish desktop/PCBooster.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
      - name: Prepare and verify one EXE
        shell: pwsh
        run: |
          [xml]$project = Get-Content "desktop/PCBooster.Desktop.csproj"
          $version = $project.Project.PropertyGroup.Version
          $publish = "desktop/bin/Release/net10.0-windows/win-x64/publish"
          $source = Join-Path $publish "PC Booster.exe"
          if (!(Test-Path $source)) { throw "Publish output not found: $source" }
          $files = @(Get-ChildItem $publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "PC Booster.exe") { throw "Publish folder must contain exactly one EXE; found: $($files.Name -join ', ')" }
          Copy-Item $source "PC-Booster.exe" -Force
          $size = (Get-Item "PC-Booster.exe").Length
          Write-Host ("Self-contained EXE size: {0:N2} MB" -f ($size / 1MB))
          if ($size -ge 180MB) { throw "Unexpectedly large EXE: $size bytes" }
          $hash = (Get-FileHash "PC-Booster.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{ version = $version; sha256 = $hash; size = $size; publishedAt = (Get-Date).ToUniversalTime().ToString("o") } | ConvertTo-Json -Compress
          Set-Content -Path "latest.json" -Value $manifest -Encoding utf8NoBOM
      - name: Publish EXE to public PC Booster website
        shell: pwsh
        run: |
          $exeBackup = Join-Path $env:RUNNER_TEMP "PC-Booster.exe"
          $manifestBackup = Join-Path $env:RUNNER_TEMP "latest.json"
          Copy-Item "PC-Booster.exe" $exeBackup -Force
          Copy-Item "latest.json" $manifestBackup -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch latest main" }
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw "Could not reset to latest main" }
            Copy-Item $exeBackup "PC-Booster.exe" -Force
            Copy-Item $manifestBackup "latest.json" -Force
            git add PC-Booster.exe latest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "Published EXE and manifest are already current."; break }
            git commit -m "Publish standalone PC Booster executable"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit executable" }
            git push
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "Could not publish executable after 5 attempts" }
            Start-Sleep -Seconds 3
          }
      - name: Publish standalone EXE release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content "desktop/PCBooster.Desktop.csproj"
          $version = $project.Project.PropertyGroup.Version
          $tag = "desktop-v$version"
          $title = "PC Booster Desktop $version"
          $notes = "Автономная версия для Windows 10/11 x64. .NET уже включён в EXE — отдельно устанавливать ничего не нужно. Встроенная проверка обновлений. Один файл: PC-Booster.exe."
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub release" }
          }
          gh release upload $tag "PC-Booster.exe" --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload EXE" }
          gh release edit $tag --repo ${{ github.repository }} --title $title --notes $notes
