name: Build PC Booster Desktop
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish compact Windows application
        run: dotnet publish desktop/PCBooster.Desktop.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
      - name: Package and verify size
        shell: pwsh
        run: |
          $publish = "desktop/bin/Release/net10.0-windows/win-x64/publish"
          if (!(Test-Path "$publish/PC Booster.exe")) { throw "Publish output not found" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "$publish/PC Booster.exe" "out/PC Booster.exe"
          Copy-Item "desktop/README-RU.txt" "out/Инструкция.txt"
          Compress-Archive -Path "out/*" -DestinationPath "PC-Booster-Windows-x64.zip" -CompressionLevel Optimal -Force
          $size = (Get-Item "PC-Booster-Windows-x64.zip").Length
          Write-Host ("ZIP size: {0:N2} MB" -f ($size / 1MB))
          if ($size -ge 20MB) { throw "Package exceeds 20 MB target: $size bytes" }
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "desktop-v0.2.0"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --title "PC Booster Desktop 0.2.0 — Compact" --notes "Компактная сборка Windows x64. Все функции приложения сохранены. Требуется .NET 10 Desktop Runtime x64 (устанавливается один раз)."
          }
          gh release upload $tag "out/PC Booster.exe" "PC-Booster-Windows-x64.zip" --repo ${{ github.repository }} --clobber
