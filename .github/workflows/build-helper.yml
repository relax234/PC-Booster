name: Build Windows Helper
on:
  push:
    branches: [main]
    paths:
      - "helper/**"
      - ".github/workflows/build-helper.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows x64 executable
        run: dotnet publish .\helper\PCBoosterHelper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\out
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Booster-Helper-win-x64
          path: .\out\PC Booster Helper.exe
          if-no-files-found: error
          retention-days: 30
