name: Build and publish PC Booster Helper
on:
  push:
    branches: [main]
    paths:
      - "helper/**"
      - ".github/workflows/build-helper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: dotnet publish .\helper\PCBoosterHelper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\out
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path ".\out\PC Booster Helper.exe" -DestinationPath ".\PC-Booster-Helper-Windows-x64.zip" -Force
      - name: Publish stable download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "helper-v0.1.0"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --title "PC Booster Helper 0.1.0" --notes "Windows 10/11 x64. Download the ZIP, extract it, then run PC Booster Helper.exe. The helper only reads basic PC diagnostics and does not change Windows."
          }
          gh release upload $tag ".\out\PC Booster Helper.exe" ".\PC-Booster-Helper-Windows-x64.zip" --repo ${{ github.repository }} --clobber
